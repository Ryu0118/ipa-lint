rules:
- name: readme-rules
  sources:
  - Sources/IPALintKit/Rules/**/*.swift
  - Sources/IPALintCLI/Commands/*.swift
  doc: README.md
  message: A rule or command changed; update the rule table and command reference
    in README.md.
  checksum: 7ba3f02a0af22e592252ec6742366c1b651cb5638d431eb70729a594ee50424c
- name: readme-package
  sources:
  - Package.swift
  doc: README.md
  message: Package.swift changed; review the user-facing package commands in README.md.
  checksum: 9aab755da18ecc97422f431cfeca4d4650b58fb5cbe42c2b295a2f4767d19f89
- name: claude-package
  sources:
  - Package.swift
  doc: CLAUDE.md
  message: Package.swift changed; review the package architecture in CLAUDE.md.
  checksum: 9aab755da18ecc97422f431cfeca4d4650b58fb5cbe42c2b295a2f4767d19f89
- name: claude-mise-tasks
  sources:
  - .mise.toml
  doc: CLAUDE.md
  message: .mise.toml changed; review the command list in CLAUDE.md.
  checksum: 28af655d1701f11eb8e943cc5c292969c3114b7332462fbe10ad007e3b79ad2b
- name: rules-lint-and-format
  sources:
  - .swiftformat
  - .swiftlint.yml
  - .my-swift-linter.yml
  doc: .agents/rules/lint-and-format.md
  message: A lint or format config changed; update .agents/rules/lint-and-format.md
    to match.
  checksum: 33a060ff5b80429dd0f3878c75ab090efc6d672cc40fa431c3f4f33881017c19
- name: rules-workflow
  sources:
  - .gitnagg.yml
  - .githooks/pre-commit
  - .githooks/pre-push
  - scripts/lint-staged.sh
  doc: .agents/rules/workflow.md
  message: A commit gate or hook changed; update .agents/rules/workflow.md to match.
  checksum: be6c0d95dfba25fad025fdfa4df30901190fc6f2ed2d1fbcb0fdeac8c2ebbcc4
